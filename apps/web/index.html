<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="聚合原神、崩坏：星穹铁道、绝区零、鸣潮等游戏的活动与卡池日历，倒计时、循环活动与完成打卡一目了然。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Game Calendar" />
    <meta property="og:title" content="Game Calendar" />
    <meta property="og:description" content="聚合多款游戏的活动与卡池日历，倒计时、循环活动与完成打卡一目了然。" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1020" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico" />
    <link rel="manifest" href="/favicon/manifest.json" />
    <meta name="msapplication-config" content="/favicon/browserconfig.xml" />
    <meta name="msapplication-TileColor" content="#ffffff" />
    <script>
      (function () {
        try {
          var key = "gc.theme";
          var stored = localStorage.getItem(key);
          var isDark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (isDark) root.classList.add("dark");
          else root.classList.remove("dark");
        } catch (e) {
          /* noop */
        }
      })();
    </script>
    <title>Game Calendar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
