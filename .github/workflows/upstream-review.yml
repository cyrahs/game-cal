name: Upstream Review

on:
  workflow_dispatch:

concurrency:
  group: upstream-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Verify OpenAI configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ secrets.OPENAI_REASONING_EFFORT }}
        run: |
          missing=()
          for secret_name in \
            OPENAI_API_KEY \
            OPENAI_BASE_URL \
            OPENAI_MODEL \
            OPENAI_REASONING_EFFORT
          do
            if [ -z "${!secret_name:-}" ]; then
              missing+=("$secret_name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "Missing required workflow secret(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Verify independent reviewer identity
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_REVIEW_APPROVAL_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "Missing required workflow secret: UPSTREAM_REVIEW_APPROVAL_TOKEN" >&2
            exit 1
          fi
          reviewer_login="$(gh api user --jq .login)"
          if [ "$reviewer_login" = "github-actions[bot]" ]; then
            echo "The approval token must use an identity different from github-actions[bot]." >&2
            exit 1
          fi
          if ! gh api "repos/$GH_REPO" --jq '.permissions.admin == true' | grep -qx true; then
            echo "The approval-token identity must have admin access to $GH_REPO." >&2
            exit 1
          fi
          protection_path="$RUNNER_TEMP/upstream-review-branch-protection.json"
          if ! gh api "repos/$GH_REPO/branches/$DEFAULT_BRANCH/protection" > "$protection_path"; then
            echo "The default branch must require pull request reviews and invalidate stale approvals." >&2
            exit 1
          fi
          if ! jq -e '
            (.required_pull_request_reviews.required_approving_review_count // 0) >= 1 and
            (
              .required_pull_request_reviews.dismiss_stale_reviews == true or
              .required_pull_request_reviews.require_last_push_approval == true
            )
          ' "$protection_path" >/dev/null
          then
            echo "Enable at least one required approval plus stale-review dismissal or last-push approval." >&2
            exit 1
          fi
          echo "Independent PR reviewer identity: $reviewer_login" >> "$GITHUB_STEP_SUMMARY"

  collect:
    needs: preflight
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.9.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-lockfile

      - name: Start local API
        run: nohup pnpm --filter @game-cal/api exec tsx src/index.ts > "$RUNNER_TEMP/api.log" 2>&1 &

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Collect review input
        env:
          UPSTREAM_REVIEW_API_BASE_URL: http://127.0.0.1:8787
          UPSTREAM_REVIEW_INPUT_PATH: artifacts/upstream-review-input.json
        run: pnpm review:upstream:collect

      - name: Upload review input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-review-input
          path: artifacts/upstream-review-input.json
          if-no-files-found: error

      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-review-api-log
          path: ${{ runner.temp }}/api.log
          if-no-files-found: warn

  review:
    needs: collect
    name: Review ${{ matrix.game }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        game:
          - genshin
          - starrail
          - ww
          - zzz
          - snowbreak
          - endfield
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download review input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review-input
          path: artifacts

      - name: Prepare single-game review input
        env:
          UPSTREAM_REVIEW_GAME: ${{ matrix.game }}
          UPSTREAM_REVIEW_INPUT_PATH: artifacts/upstream-review-input.json
        run: node scripts/review-upstream.mjs --extract-game

      - name: Review with Codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}
          model: ${{ secrets.OPENAI_MODEL }}
          effort: ${{ secrets.OPENAI_REASONING_EFFORT }}
          prompt-file: .github/prompts/upstream-review.md
          output-schema-file: .github/schemas/upstream-review-output.schema.json
          output-file: artifacts/upstream-review-agent-${{ matrix.game }}.json
          codex-version: "0.145.0"
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

      - name: Upload Codex review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-review-agent-${{ matrix.game }}
          path: artifacts/upstream-review-agent-${{ matrix.game }}.json
          if-no-files-found: error

  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_findings: ${{ steps.prepare_fix.outputs.has_findings }}
      finding_count: ${{ steps.prepare_fix.outputs.finding_count }}
      finding_fingerprint: ${{ steps.prepare_fix.outputs.finding_fingerprint }}
      fix_branch: ${{ steps.prepare_fix.outputs.fix_branch }}
      issue_number: ${{ steps.prepare_fix.outputs.issue_number }}
      issue_url: ${{ steps.prepare_fix.outputs.issue_url }}
      remediation_cycle: ${{ steps.prepare_fix.outputs.remediation_cycle }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Download review input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review-input
          path: artifacts

      - name: Download Codex review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: upstream-review-agent-*
          path: artifacts/agent-reviews
          merge-multiple: true

      - name: Validate result and sync issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REVIEW_INPUT_PATH: artifacts/upstream-review-input.json
          UPSTREAM_REVIEW_AGENT_OUTPUT_DIR: artifacts/agent-reviews
          UPSTREAM_REVIEW_REPORT_PATH: artifacts/upstream-review.json
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/review-upstream.mjs --finalize

      - name: Prepare automatic fix request
        id: prepare_fix
        env:
          UPSTREAM_REVIEW_REPORT_PATH: artifacts/upstream-review.json
          UPSTREAM_REVIEW_FIX_INPUT_PATH: artifacts/upstream-review-fix-input.json
        run: node scripts/review-upstream.mjs --prepare-fix

      - name: Upload final review artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-review
          path: artifacts
          if-no-files-found: warn

  repair:
    needs: publish
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.publish.outputs.has_findings == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_patch: ${{ steps.finalize_fix.outputs.has_patch }}
      existing_pr_url: ${{ steps.guard.outputs.existing_pr_url }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Skip findings that already have an automatic PR
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FIX_BRANCH: ${{ needs.publish.outputs.fix_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          existing_url="$(
            gh pr list \
              --repo "$GH_REPO" \
              --state open \
              --base "$DEFAULT_BRANCH" \
              --head "$FIX_BRANCH" \
              --limit 100 \
              --json isCrossRepository,url \
              --jq '[.[] | select(.isCrossRepository == false)][0].url // ""'
          )"
          if [ -n "$existing_url" ]; then
            echo "should_repair=false" >> "$GITHUB_OUTPUT"
            echo "existing_pr_url=$existing_url" >> "$GITHUB_OUTPUT"
            echo "An open automatic PR already exists for this remediation attempt: $existing_url" >> "$GITHUB_STEP_SUMMARY"
            echo "This run stops before starting another fix agent; continue that draft PR manually or close it before retrying the same base." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_repair=true" >> "$GITHUB_OUTPUT"
            echo "existing_pr_url=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.guard.outputs.should_repair == 'true'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.guard.outputs.should_repair == 'true'
        with:
          node-version: 25

      - name: Download finalized review
        if: steps.guard.outputs.should_repair == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review
          path: ${{ runner.temp }}/upstream-review

      - name: Place compact fix request in the workspace
        id: prepare_fix_workspace
        if: steps.guard.outputs.should_repair == 'true'
        run: |
          hash_or_absent() {
            if [ -f "$1" ]; then
              /usr/bin/sha256sum "$1" | /usr/bin/cut -d ' ' -f 1
            else
              echo "absent"
            fi
          }
          trusted_state_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/upstream-review-trusted-state.XXXXXX")"
          /usr/bin/cp \
            "$RUNNER_TEMP/upstream-review/upstream-review-fix-input.json" \
            "$trusted_state_dir/fix-input.json"
          /usr/bin/cp .git/config "$trusted_state_dir/git-config"
          /usr/bin/cp .git/index "$trusted_state_dir/git-index"
          /usr/bin/cp .git/HEAD "$trusted_state_dir/git-head"
          if [ -f .git/config.worktree ]; then
            /usr/bin/cp .git/config.worktree "$trusted_state_dir/git-config-worktree"
          fi
          if [ -f .git/info/attributes ]; then
            /usr/bin/cp .git/info/attributes "$trusted_state_dir/git-info-attributes"
          fi
          mkdir -p artifacts
          cp \
            "$trusted_state_dir/fix-input.json" \
            artifacts/upstream-review-fix-input.json
          echo "trusted_state_dir=$trusted_state_dir" >> "$GITHUB_OUTPUT"
          echo "input_sha256=$(hash_or_absent "$trusted_state_dir/fix-input.json")" >> "$GITHUB_OUTPUT"
          echo "git_config_sha256=$(hash_or_absent "$trusted_state_dir/git-config")" >> "$GITHUB_OUTPUT"
          echo "git_config_worktree_sha256=$(hash_or_absent "$trusted_state_dir/git-config-worktree")" >> "$GITHUB_OUTPUT"
          echo "git_index_sha256=$(hash_or_absent "$trusted_state_dir/git-index")" >> "$GITHUB_OUTPUT"
          echo "git_head_sha256=$(hash_or_absent "$trusted_state_dir/git-head")" >> "$GITHUB_OUTPUT"
          echo "git_info_attributes_sha256=$(hash_or_absent "$trusted_state_dir/git-info-attributes")" >> "$GITHUB_OUTPUT"
          echo "node_bin=$(command -v node)" >> "$GITHUB_OUTPUT"

      - name: Repair with Codex
        if: steps.guard.outputs.should_repair == 'true'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}
          model: ${{ secrets.OPENAI_MODEL }}
          effort: ${{ secrets.OPENAI_REASONING_EFFORT }}
          prompt-file: .github/prompts/upstream-review-fix.md
          output-schema-file: .github/schemas/upstream-review-fix-output.schema.json
          output-file: artifacts/upstream-review-fix-agent.json
          codex-version: "0.145.0"
          permission-profile: ":workspace"
          safety-strategy: drop-sudo

      - name: Export and validate candidate patch
        id: finalize_fix
        if: steps.guard.outputs.should_repair == 'true'
        env:
          BASH_ENV: /dev/null
          ENV: /dev/null
          EXPECTED_FIX_INPUT_SHA256: ${{ steps.prepare_fix_workspace.outputs.input_sha256 }}
          EXPECTED_GIT_CONFIG_SHA256: ${{ steps.prepare_fix_workspace.outputs.git_config_sha256 }}
          EXPECTED_GIT_CONFIG_WORKTREE_SHA256: ${{ steps.prepare_fix_workspace.outputs.git_config_worktree_sha256 }}
          EXPECTED_GIT_INDEX_SHA256: ${{ steps.prepare_fix_workspace.outputs.git_index_sha256 }}
          EXPECTED_GIT_HEAD_SHA256: ${{ steps.prepare_fix_workspace.outputs.git_head_sha256 }}
          EXPECTED_GIT_INFO_ATTRIBUTES_SHA256: ${{ steps.prepare_fix_workspace.outputs.git_info_attributes_sha256 }}
          TRUSTED_STATE_DIR: ${{ steps.prepare_fix_workspace.outputs.trusted_state_dir }}
          TRUSTED_NODE_BIN: ${{ steps.prepare_fix_workspace.outputs.node_bin }}
          PATH: /usr/bin:/bin
          NODE_OPTIONS: ""
          NODE_PATH: ""
          LD_PRELOAD: ""
          DYLD_INSERT_LIBRARIES: ""
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_COUNT: "0"
          GIT_ATTR_NOSYSTEM: "1"
          GIT_NO_REPLACE_OBJECTS: "1"
          GIT_EXTERNAL_DIFF: ""
          GIT_DIFF_OPTS: ""
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ steps.prepare_fix_workspace.outputs.trusted_state_dir }}/fix-input.json
          UPSTREAM_REVIEW_FIX_AGENT_OUTPUT_PATH: artifacts/upstream-review-fix-agent.json
        run: |
          unset \
            GIT_CONFIG_PARAMETERS \
            GIT_INDEX_FILE \
            GIT_OBJECT_DIRECTORY \
            GIT_WORK_TREE \
            GIT_DIR \
            GIT_COMMON_DIR \
            GIT_ALTERNATE_OBJECT_DIRECTORIES \
            GIT_EXEC_PATH
          hash_or_absent() {
            if [ -f "$1" ]; then
              /usr/bin/sha256sum "$1" | /usr/bin/cut -d ' ' -f 1
            else
              echo "absent"
            fi
          }
          for state_check in \
            "$UPSTREAM_REVIEW_FIX_INPUT_PATH:$EXPECTED_FIX_INPUT_SHA256" \
            "$TRUSTED_STATE_DIR/git-config:$EXPECTED_GIT_CONFIG_SHA256" \
            "$TRUSTED_STATE_DIR/git-config-worktree:$EXPECTED_GIT_CONFIG_WORKTREE_SHA256" \
            "$TRUSTED_STATE_DIR/git-index:$EXPECTED_GIT_INDEX_SHA256" \
            "$TRUSTED_STATE_DIR/git-head:$EXPECTED_GIT_HEAD_SHA256" \
            "$TRUSTED_STATE_DIR/git-info-attributes:$EXPECTED_GIT_INFO_ATTRIBUTES_SHA256"
          do
            state_path="${state_check%%:*}"
            expected_state="${state_check#*:}"
            if [ "$(hash_or_absent "$state_path")" != "$expected_state" ]; then
              echo "Protected state changed during the Codex step: $state_path" >&2
              exit 1
            fi
          done
          if [ "$EXPECTED_GIT_CONFIG_WORKTREE_SHA256" = "absent" ]; then
            if [ -e .git/config.worktree ]; then
              echo "Codex created an unexpected .git/config.worktree file." >&2
              exit 1
            fi
          else
            /usr/bin/cp "$TRUSTED_STATE_DIR/git-config-worktree" .git/config.worktree
          fi
          if [ "$EXPECTED_GIT_INFO_ATTRIBUTES_SHA256" = "absent" ]; then
            if [ -e .git/info/attributes ]; then
              echo "Codex created an unexpected .git/info/attributes file." >&2
              exit 1
            fi
          else
            /usr/bin/cp "$TRUSTED_STATE_DIR/git-info-attributes" .git/info/attributes
          fi
          /usr/bin/cp "$TRUSTED_STATE_DIR/git-config" .git/config
          /usr/bin/cp "$TRUSTED_STATE_DIR/git-index" .git/index
          /usr/bin/cp "$TRUSTED_STATE_DIR/git-head" .git/HEAD
          if /usr/bin/find . -path './.git' -prune -o -name .gitattributes -print -quit | /usr/bin/grep -q .; then
            echo "Codex created an unexpected .gitattributes file." >&2
            exit 1
          fi
          if [ ! -x "$TRUSTED_NODE_BIN" ]; then
            echo "The trusted Node binary is unavailable." >&2
            exit 1
          fi

          export_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/upstream-review-export.XXXXXX")"
          candidate_dir="$export_dir/candidate"
          /usr/bin/mkdir "$candidate_dir"
          echo "candidate_dir=$candidate_dir" >> "$GITHUB_OUTPUT"
          export UPSTREAM_REVIEW_FIX_METADATA_PATH="$candidate_dir/metadata.json"
          export UPSTREAM_REVIEW_FIX_MANIFEST_PATH="$candidate_dir/manifest.json"
          export UPSTREAM_REVIEW_FIX_PATCH_PATH="$candidate_dir/fix.patch"
          /usr/bin/git --no-replace-objects show "$UPSTREAM_REVIEW_BASE_SHA:scripts/review-upstream.mjs" > "$export_dir/review-upstream.mjs"
          "$TRUSTED_NODE_BIN" "$export_dir/review-upstream.mjs" --finalize-fix
          /usr/bin/cp \
            "$UPSTREAM_REVIEW_FIX_INPUT_PATH" \
            "$candidate_dir/upstream-review-fix-input.json"
          /usr/bin/cp \
            artifacts/upstream-review-fix-agent.json \
            "$candidate_dir/upstream-review-fix-agent.json"

      - name: Upload candidate patch diagnostics
        if: >-
          always() &&
          steps.guard.outputs.should_repair == 'true' &&
          steps.finalize_fix.outputs.candidate_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-review-fix-candidate
          path: ${{ steps.finalize_fix.outputs.candidate_dir }}
          if-no-files-found: warn

  validate_patch:
    needs:
      - publish
      - repair
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.repair.result == 'success' &&
      needs.repair.outputs.has_patch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download candidate patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review-fix-candidate
          path: ${{ runner.temp }}/upstream-review-fix-candidate

      - name: Verify candidate artifact
        env:
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-candidate/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-candidate/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-candidate/fix.patch
        run: node scripts/review-upstream.mjs --verify-fix-artifact

      - name: Apply candidate patch
        run: |
          /usr/bin/git apply --check "$RUNNER_TEMP/upstream-review-fix-candidate/fix.patch"
          /usr/bin/git apply "$RUNNER_TEMP/upstream-review-fix-candidate/fix.patch"

      - name: Revalidate applied candidate
        env:
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-candidate/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_AGENT_OUTPUT_PATH: ${{ runner.temp }}/upstream-review-fix-candidate/upstream-review-fix-agent.json
          UPSTREAM_REVIEW_FIX_METADATA_PATH: ${{ runner.temp }}/upstream-review-fix-verified/metadata.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-verified/fix.patch
          UPSTREAM_REVIEW_EXPECTED_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-candidate/manifest.json
        run: node scripts/review-upstream.mjs --finalize-fix

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.9.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test upstream-review safeguards
        run: pnpm test:upstream-review

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Confirm tests did not alter the patch
        env:
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-candidate/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_AGENT_OUTPUT_PATH: ${{ runner.temp }}/upstream-review-fix-candidate/upstream-review-fix-agent.json
          UPSTREAM_REVIEW_FIX_METADATA_PATH: ${{ runner.temp }}/upstream-review-fix-verified/metadata.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-verified/fix.patch
          UPSTREAM_REVIEW_EXPECTED_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-candidate/manifest.json
        run: |
          node scripts/review-upstream.mjs --finalize-fix
          cp \
            "$RUNNER_TEMP/upstream-review-fix-candidate/upstream-review-fix-input.json" \
            "$RUNNER_TEMP/upstream-review-fix-candidate/upstream-review-fix-agent.json" \
            "$RUNNER_TEMP/upstream-review-fix-verified/"

      - name: Upload verified patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-review-fix-verified
          path: ${{ runner.temp }}/upstream-review-fix-verified
          if-no-files-found: error

  open_pr:
    needs:
      - publish
      - repair
      - validate_patch
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.repair.result == 'success' &&
      needs.repair.outputs.has_patch == 'true' &&
      needs.validate_patch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
      pr_url: ${{ steps.create_pr.outputs.pr_url }}
      head_sha: ${{ steps.commit_fix.outputs.head_sha }}
      all_findings_addressed: ${{ steps.render_pr.outputs.all_findings_addressed }}
      issue_reference: ${{ steps.render_pr.outputs.issue_reference }}
      pr_body_sha256: ${{ steps.render_pr.outputs.pr_body_sha256 }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Download verified patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review-fix-verified
          path: ${{ runner.temp }}/upstream-review-fix-verified

      - name: Verify immutable patch artifact
        id: verify_fix
        env:
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-verified/fix.patch
        run: node scripts/review-upstream.mjs --verify-fix-artifact

      - name: Confirm branch identity and repository state
        id: repository_state
        env:
          EXPECTED_BRANCH: ${{ needs.publish.outputs.fix_branch }}
          VERIFIED_BRANCH: ${{ steps.verify_fix.outputs.fix_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.sha }}
        run: |
          if [ "$VERIFIED_BRANCH" != "$EXPECTED_BRANCH" ]; then
            echo "Verified branch does not match the published finding fingerprint." >&2
            exit 1
          fi
          /usr/bin/git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH"
          if [ "$(/usr/bin/git rev-parse FETCH_HEAD)" != "$BASE_SHA" ]; then
            echo "The default branch advanced during review; rerun the workflow." >&2
            exit 1
          fi
          remote_ref="$(/usr/bin/git ls-remote --heads origin "refs/heads/$VERIFIED_BRANCH")"
          if [ -n "$remote_ref" ]; then
            echo "remote_branch_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "remote_branch_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply and revalidate verified patch
        env:
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_AGENT_OUTPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-agent.json
          UPSTREAM_REVIEW_FIX_METADATA_PATH: ${{ runner.temp }}/upstream-review-fix-recheck/metadata.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-recheck/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-recheck/fix.patch
          UPSTREAM_REVIEW_EXPECTED_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
        run: |
          /usr/bin/git apply --check "$RUNNER_TEMP/upstream-review-fix-verified/fix.patch"
          /usr/bin/git apply --index "$RUNNER_TEMP/upstream-review-fix-verified/fix.patch"
          node scripts/review-upstream.mjs --finalize-fix

      - name: Render deterministic PR body
        id: render_pr
        env:
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_METADATA_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-agent.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-verified/fix.patch
          UPSTREAM_REVIEW_PR_BODY_PATH: ${{ runner.temp }}/upstream-review-pr-body.md
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/review-upstream.mjs --render-fix-pr

      - name: Commit and push automatic fix branch
        id: commit_fix
        env:
          FIX_BRANCH: ${{ steps.verify_fix.outputs.fix_branch }}
          BASE_SHA: ${{ github.sha }}
          REMOTE_BRANCH_EXISTS: ${{ steps.repository_state.outputs.remote_branch_exists }}
        run: |
          if [ "$REMOTE_BRANCH_EXISTS" = "true" ]; then
            /usr/bin/git fetch \
              --no-tags \
              origin \
              "refs/heads/$FIX_BRANCH:refs/remotes/origin/upstream-review-existing"
            expected_tree="$(/usr/bin/git write-tree)"
            remote_tree="$(/usr/bin/git rev-parse refs/remotes/origin/upstream-review-existing^{tree})"
            remote_line="$(/usr/bin/git rev-list --parents -n 1 refs/remotes/origin/upstream-review-existing)"
            read -r remote_commit remote_parent extra_parent <<< "$remote_line"
            if \
              [ -n "$extra_parent" ] ||
              [ "$remote_parent" != "$BASE_SHA" ] ||
              [ "$remote_tree" != "$expected_tree" ]
            then
              echo "The existing automatic branch does not exactly match this verified patch." >&2
              exit 1
            fi
            echo "Reusing the exact orphaned automatic branch after a prior PR creation failure."
          else
            /usr/bin/git switch -c "$FIX_BRANCH"
            /usr/bin/git config user.name "github-actions[bot]"
            /usr/bin/git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            /usr/bin/git -c core.hooksPath=/dev/null commit -m "fix: address upstream review findings"
            /usr/bin/git push origin "HEAD:refs/heads/$FIX_BRANCH"
            remote_commit="$(/usr/bin/git rev-parse HEAD)"
          fi
          echo "head_sha=$remote_commit" >> "$GITHUB_OUTPUT"

      - name: Open draft pull request
        id: create_pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FIX_BRANCH: ${{ steps.verify_fix.outputs.fix_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ steps.commit_fix.outputs.head_sha }}
          EXPECTED_PR_BODY_SHA256: ${{ steps.render_pr.outputs.pr_body_sha256 }}
        run: |
          actual_local_body_sha256="$(
            /usr/bin/sha256sum "$RUNNER_TEMP/upstream-review-pr-body.md" |
              /usr/bin/cut -d ' ' -f 1
          )"
          if [ "$actual_local_body_sha256" != "$EXPECTED_PR_BODY_SHA256" ]; then
            echo "The deterministic PR body changed before PR creation." >&2
            exit 1
          fi
          repo_owner="${GH_REPO%%/*}"
          gh api \
            --method GET \
            "repos/$GH_REPO/pulls" \
            -f state=open \
            -f head="$repo_owner:$FIX_BRANCH" \
            -f base="$DEFAULT_BRANCH" \
            -f per_page=100 \
            > "$RUNNER_TEMP/upstream-review-matching-prs.json"
          matching_pr_count="$(
            jq 'length' "$RUNNER_TEMP/upstream-review-matching-prs.json"
          )"
          if [ "$matching_pr_count" = "0" ]; then
            pr_url="$(
              gh pr create \
                --repo "$GH_REPO" \
                --draft \
                --base "$DEFAULT_BRANCH" \
                --head "$FIX_BRANCH" \
                --title "fix: address upstream review findings" \
                --body-file "$RUNNER_TEMP/upstream-review-pr-body.md"
            )"
            pr_number="${pr_url##*/}"
          elif [ "$matching_pr_count" = "1" ]; then
            pr_number="$(
              jq -r '.[0].number' "$RUNNER_TEMP/upstream-review-matching-prs.json"
            )"
            pr_url="$(
              jq -r '.[0].html_url' "$RUNNER_TEMP/upstream-review-matching-prs.json"
            )"
            echo "Reusing the exact draft PR after a prior post-creation failure."
          else
            echo "More than one open pull request uses the automatic remediation branch." >&2
            exit 1
          fi
          if ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            echo "Could not determine the automatic PR number from: $pr_url" >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/pulls/$pr_number" > "$RUNNER_TEMP/upstream-review-pr.json"
          actual_api_body_sha256="$(
            jq -j '.body // ""' "$RUNNER_TEMP/upstream-review-pr.json" |
              /usr/bin/sha256sum |
              /usr/bin/cut -d ' ' -f 1
          )"
          if [ "$actual_api_body_sha256" != "$EXPECTED_PR_BODY_SHA256" ]; then
            echo "The automatic PR body does not match the deterministic rendering." >&2
            exit 1
          fi
          if ! jq -e \
            --argjson number "$pr_number" \
            --arg url "$pr_url" \
            --arg repo "$GH_REPO" \
            --arg base_ref "$DEFAULT_BRANCH" \
            --arg base_sha "$BASE_SHA" \
            --arg head_ref "$FIX_BRANCH" \
            --arg head_sha "$HEAD_SHA" \
            '
              .number == $number and
              .html_url == $url and
              .state == "open" and
              .draft == true and
              .user.login == "github-actions[bot]" and
              .base.repo.full_name == $repo and
              .base.ref == $base_ref and
              .base.sha == $base_sha and
              .head.repo.full_name == $repo and
              .head.ref == $head_ref and
              .head.sha == $head_sha
            ' \
            "$RUNNER_TEMP/upstream-review-pr.json" >/dev/null
          then
            echo "The automatic PR does not match the verified branch snapshot." >&2
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Draft PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"

  review_pr:
    needs:
      - publish
      - validate_patch
      - open_pr
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.validate_patch.result == 'success' &&
      needs.open_pr.result == 'success' &&
      needs.open_pr.outputs.pr_number != '' &&
      needs.open_pr.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      review_json: ${{ steps.review_fix.outputs['final-message'] }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Download verified patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review-fix-verified
          path: ${{ runner.temp }}/upstream-review-fix-verified

      - name: Prepare exact PR review workspace
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
          PR_URL: ${{ needs.open_pr.outputs.pr_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIX_BRANCH: ${{ needs.publish.outputs.fix_branch }}
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_HEAD_SHA: ${{ needs.open_pr.outputs.head_sha }}
          UPSTREAM_REVIEW_PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
          UPSTREAM_REVIEW_PR_URL: ${{ needs.open_pr.outputs.pr_url }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-verified/fix.patch
          UPSTREAM_REVIEW_PR_REVIEW_INPUT_PATH: artifacts/upstream-review-pr-review-input.json
        run: |
          node scripts/review-upstream.mjs --verify-fix-artifact
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/upstream-review-pr.json"
          if ! jq -e \
            --arg repo "$GH_REPO" \
            --arg base_ref "$DEFAULT_BRANCH" \
            --arg base_sha "$UPSTREAM_REVIEW_BASE_SHA" \
            --arg head_ref "$FIX_BRANCH" \
            --arg head_sha "$UPSTREAM_REVIEW_HEAD_SHA" \
            '
              .state == "open" and
              .draft == true and
              .base.repo.full_name == $repo and
              .base.ref == $base_ref and
              .base.sha == $base_sha and
              .head.repo.full_name == $repo and
              .head.ref == $head_ref and
              .head.sha == $head_sha
            ' \
            "$RUNNER_TEMP/upstream-review-pr.json" >/dev/null
          then
            echo "The PR changed before Codex review." >&2
            exit 1
          fi

          /usr/bin/git apply --check "$UPSTREAM_REVIEW_FIX_PATCH_PATH"
          /usr/bin/git apply --index "$UPSTREAM_REVIEW_FIX_PATCH_PATH"
          expected_tree="$(/usr/bin/git write-tree)"
          /usr/bin/git fetch \
            --no-tags \
            origin \
            "refs/heads/$FIX_BRANCH:refs/remotes/origin/upstream-review-pr"
          remote_commit="$(/usr/bin/git rev-parse refs/remotes/origin/upstream-review-pr)"
          remote_tree="$(/usr/bin/git rev-parse refs/remotes/origin/upstream-review-pr^{tree})"
          remote_line="$(/usr/bin/git rev-list --parents -n 1 refs/remotes/origin/upstream-review-pr)"
          read -r _ remote_parent extra_parent <<< "$remote_line"
          if \
            [ "$remote_commit" != "$UPSTREAM_REVIEW_HEAD_SHA" ] ||
            [ "$remote_parent" != "$UPSTREAM_REVIEW_BASE_SHA" ] ||
            [ -n "$extra_parent" ] ||
            [ "$remote_tree" != "$expected_tree" ]
          then
            echo "The PR commit does not exactly match the verified patch." >&2
            exit 1
          fi

          /usr/bin/git reset --hard "$UPSTREAM_REVIEW_HEAD_SHA"
          mkdir -p artifacts
          cp \
            "$UPSTREAM_REVIEW_FIX_INPUT_PATH" \
            artifacts/upstream-review-fix-input.json
          node scripts/review-upstream.mjs --prepare-pr-review

      - name: Review verified PR with Codex
        id: review_fix
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}
          model: ${{ secrets.OPENAI_MODEL }}
          effort: ${{ secrets.OPENAI_REASONING_EFFORT }}
          prompt-file: .github/prompts/upstream-review-pr-review.md
          output-schema-file: .github/schemas/upstream-review-pr-review-output.schema.json
          codex-version: "0.145.0"
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

  validate_pr_review:
    needs:
      - publish
      - validate_patch
      - open_pr
      - review_pr
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.validate_patch.result == 'success' &&
      needs.open_pr.result == 'success' &&
      needs.review_pr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      review_event: ${{ steps.finalize_review.outputs.review_event }}
      review_verdict: ${{ steps.finalize_review.outputs.review_verdict }}
      review_context_sha256: ${{ steps.finalize_review.outputs.review_context_sha256 }}
      review_result_sha256: ${{ steps.finalize_review.outputs.review_result_sha256 }}
      review_request_sha256: ${{ steps.finalize_review.outputs.review_request_sha256 }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Download verified patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review-fix-verified
          path: ${{ runner.temp }}/upstream-review-fix-verified

      - name: Reconstruct exact reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIX_BRANCH: ${{ needs.publish.outputs.fix_branch }}
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_HEAD_SHA: ${{ needs.open_pr.outputs.head_sha }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-verified/fix.patch
        run: |
          node scripts/review-upstream.mjs --verify-fix-artifact
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/upstream-review-pr.json"
          if ! jq -e \
            --arg repo "$GH_REPO" \
            --arg base_ref "$DEFAULT_BRANCH" \
            --arg base_sha "$UPSTREAM_REVIEW_BASE_SHA" \
            --arg head_ref "$FIX_BRANCH" \
            --arg head_sha "$UPSTREAM_REVIEW_HEAD_SHA" \
            '
              .state == "open" and
              .draft == true and
              .base.repo.full_name == $repo and
              .base.ref == $base_ref and
              .base.sha == $base_sha and
              .head.repo.full_name == $repo and
              .head.ref == $head_ref and
              .head.sha == $head_sha
            ' \
            "$RUNNER_TEMP/upstream-review-pr.json" >/dev/null
          then
            echo "The PR changed after Codex review." >&2
            exit 1
          fi

          /usr/bin/git apply --check "$UPSTREAM_REVIEW_FIX_PATCH_PATH"
          /usr/bin/git apply --index "$UPSTREAM_REVIEW_FIX_PATCH_PATH"
          expected_tree="$(/usr/bin/git write-tree)"
          /usr/bin/git fetch \
            --no-tags \
            origin \
            "refs/heads/$FIX_BRANCH:refs/remotes/origin/upstream-review-pr"
          remote_commit="$(/usr/bin/git rev-parse refs/remotes/origin/upstream-review-pr)"
          remote_tree="$(/usr/bin/git rev-parse refs/remotes/origin/upstream-review-pr^{tree})"
          remote_line="$(/usr/bin/git rev-list --parents -n 1 refs/remotes/origin/upstream-review-pr)"
          read -r _ remote_parent extra_parent <<< "$remote_line"
          if \
            [ "$remote_commit" != "$UPSTREAM_REVIEW_HEAD_SHA" ] ||
            [ "$remote_parent" != "$UPSTREAM_REVIEW_BASE_SHA" ] ||
            [ -n "$extra_parent" ] ||
            [ "$remote_tree" != "$expected_tree" ]
          then
            echo "The reviewed PR commit no longer matches the verified patch." >&2
            exit 1
          fi
          /usr/bin/git reset --hard "$UPSTREAM_REVIEW_HEAD_SHA"

      - name: Rebuild trusted review context
        env:
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_HEAD_SHA: ${{ needs.open_pr.outputs.head_sha }}
          UPSTREAM_REVIEW_PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
          UPSTREAM_REVIEW_PR_URL: ${{ needs.open_pr.outputs.pr_url }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-verified/fix.patch
          UPSTREAM_REVIEW_PR_REVIEW_INPUT_PATH: ${{ runner.temp }}/upstream-review-pr-review/input.json
        run: node scripts/review-upstream.mjs --prepare-pr-review

      - name: Validate Codex review and render immutable request
        id: finalize_review
        env:
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_HEAD_SHA: ${{ needs.open_pr.outputs.head_sha }}
          UPSTREAM_REVIEW_PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
          UPSTREAM_REVIEW_PR_URL: ${{ needs.open_pr.outputs.pr_url }}
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-verified/fix.patch
          UPSTREAM_REVIEW_PR_REVIEW_INPUT_PATH: ${{ runner.temp }}/upstream-review-pr-review/input.json
          UPSTREAM_REVIEW_PR_REVIEW_AGENT_OUTPUT_JSON: ${{ needs.review_pr.outputs.review_json }}
          UPSTREAM_REVIEW_PR_REVIEW_BODY_PATH: ${{ runner.temp }}/upstream-review-pr-review/body.md
          UPSTREAM_REVIEW_PR_REVIEW_RESULT_PATH: ${{ runner.temp }}/upstream-review-pr-review/result.json
          UPSTREAM_REVIEW_PR_REVIEW_REQUEST_PATH: ${{ runner.temp }}/upstream-review-pr-review/request.json
        run: node scripts/review-upstream.mjs --finalize-pr-review

      - name: Upload validated review context, result, and request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-review-pr-review-validated-round-0
          path: |
            ${{ runner.temp }}/upstream-review-pr-review/input.json
            ${{ runner.temp }}/upstream-review-pr-review/result.json
            ${{ runner.temp }}/upstream-review-pr-review/request.json
          if-no-files-found: error

  submit_pr_review:
    needs:
      - publish
      - open_pr
      - validate_pr_review
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.open_pr.result == 'success' &&
      needs.validate_pr_review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Download validated review request
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review-pr-review-validated-round-0
          path: ${{ runner.temp }}/upstream-review-pr-review-request

      - name: Submit review from the independent identity
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_REVIEW_APPROVAL_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIX_BRANCH: ${{ needs.publish.outputs.fix_branch }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ needs.open_pr.outputs.head_sha }}
          EXPECTED_EVENT: ${{ needs.validate_pr_review.outputs.review_event }}
          EXPECTED_REQUEST_SHA256: ${{ needs.validate_pr_review.outputs.review_request_sha256 }}
        run: |
          request_path="$RUNNER_TEMP/upstream-review-pr-review-request/request.json"
          actual_request_sha256="$(/usr/bin/sha256sum "$request_path" | /usr/bin/cut -d ' ' -f 1)"
          if [ "$actual_request_sha256" != "$EXPECTED_REQUEST_SHA256" ]; then
            echo "The validated PR review request digest changed." >&2
            exit 1
          fi
          if ! [[ "$EXPECTED_EVENT" =~ ^(APPROVE|REQUEST_CHANGES)$ ]]; then
            echo "Invalid trusted PR review event." >&2
            exit 1
          fi
          if ! jq -e \
            --arg event "$EXPECTED_EVENT" \
            --arg head_sha "$HEAD_SHA" \
            '
              (keys | sort) == ["body", "commit_id", "event"] and
              .event == $event and
              .commit_id == $head_sha and
              (.body | type == "string") and
              (.body | length > 0)
            ' \
            "$request_path" >/dev/null
          then
            echo "The validated PR review request is malformed." >&2
            exit 1
          fi

          reviewer_login="$(gh api user --jq .login)"
          if ! gh api "repos/$GH_REPO" --jq '.permissions.admin == true' | grep -qx true; then
            echo "The approval-token identity no longer has admin access to $GH_REPO." >&2
            exit 1
          fi
          protection_path="$RUNNER_TEMP/upstream-review-branch-protection.json"
          if ! gh api "repos/$GH_REPO/branches/$DEFAULT_BRANCH/protection" > "$protection_path"; then
            echo "The default branch protection could not be verified before review submission." >&2
            exit 1
          fi
          if ! jq -e '
            (.required_pull_request_reviews.required_approving_review_count // 0) >= 1 and
            (
              .required_pull_request_reviews.dismiss_stale_reviews == true or
              .required_pull_request_reviews.require_last_push_approval == true
            )
          ' "$protection_path" >/dev/null
          then
            echo "The default branch no longer invalidates stale approvals." >&2
            exit 1
          fi
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/upstream-review-pr.json"
          author_login="$(jq -r .user.login "$RUNNER_TEMP/upstream-review-pr.json")"
          if [ "$reviewer_login" = "$author_login" ]; then
            echo "The PR author cannot approve or request changes on the same PR." >&2
            exit 1
          fi
          if ! jq -e \
            --arg repo "$GH_REPO" \
            --arg base_ref "$DEFAULT_BRANCH" \
            --arg base_sha "$BASE_SHA" \
            --arg head_ref "$FIX_BRANCH" \
            --arg head_sha "$HEAD_SHA" \
            '
              .state == "open" and
              .draft == true and
              .base.repo.full_name == $repo and
              .base.ref == $base_ref and
              .base.sha == $base_sha and
              .head.repo.full_name == $repo and
              .head.ref == $head_ref and
              .head.sha == $head_sha
            ' \
            "$RUNNER_TEMP/upstream-review-pr.json" >/dev/null
          then
            echo "The PR changed before review submission." >&2
            exit 1
          fi

          expected_state="CHANGES_REQUESTED"
          if [ "$EXPECTED_EVENT" = "APPROVE" ]; then
            expected_state="APPROVED"
          fi
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews?per_page=100" \
            > "$RUNNER_TEMP/upstream-review-existing-reviews.json"
          if jq -e \
            --arg login "$reviewer_login" \
            --arg commit "$HEAD_SHA" \
            --arg state "$expected_state" \
            '
              [
                .[] |
                select(
                  .user.login == $login and
                  .commit_id == $commit and
                  (.state == "APPROVED" or .state == "CHANGES_REQUESTED")
                )
              ] |
              sort_by(.submitted_at, .id) |
              last |
              .state == $state
            ' \
            "$RUNNER_TEMP/upstream-review-existing-reviews.json" >/dev/null
          then
            current_head="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)"
            if [ "$current_head" != "$HEAD_SHA" ]; then
              echo "The PR head changed while an existing review was checked." >&2
              exit 1
            fi
            echo "The independent reviewer already submitted $expected_state for this exact commit." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          gh api \
            --method POST \
            "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            --input "$request_path" \
            > "$RUNNER_TEMP/upstream-review-created-review.json"
          if ! jq -e \
            --arg login "$reviewer_login" \
            --arg commit "$HEAD_SHA" \
            --arg state "$expected_state" \
            '
              .user.login == $login and
              .commit_id == $commit and
              .state == $state
            ' \
            "$RUNNER_TEMP/upstream-review-created-review.json" >/dev/null
          then
            echo "GitHub returned an unexpected PR review snapshot." >&2
            exit 1
          fi
          review_id="$(jq -r .id "$RUNNER_TEMP/upstream-review-created-review.json")"
          if ! [[ "$review_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "GitHub returned an invalid PR review id." >&2
            exit 1
          fi
          current_head="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)"
          if [ "$current_head" != "$HEAD_SHA" ]; then
            if ! gh api \
              --method PUT \
              "repos/$GH_REPO/pulls/$PR_NUMBER/reviews/$review_id/dismissals" \
              -f message='Dismissed automatically because the PR head changed during review submission.' \
              -f event='DISMISS' \
              > "$RUNNER_TEMP/upstream-review-dismissed-review.json"
            then
              echo "The PR head changed and the just-created review could not be dismissed." >&2
              exit 1
            fi
            if ! jq -e \
              --arg login "$reviewer_login" \
              --arg commit "$HEAD_SHA" \
              --argjson id "$review_id" \
              '
                .id == $id and
                .user.login == $login and
                .commit_id == $commit and
                .state == "DISMISSED"
              ' \
              "$RUNNER_TEMP/upstream-review-dismissed-review.json" >/dev/null
            then
              echo "GitHub returned an unexpected dismissed-review snapshot." >&2
              exit 1
            fi
            echo "The PR head changed while the review was submitted." >&2
            exit 1
          fi
          review_url="$(jq -r .html_url "$RUNNER_TEMP/upstream-review-created-review.json")"
          echo "$expected_state review: $review_url" >> "$GITHUB_STEP_SUMMARY"

  rework_round_1:
    needs:
      - publish
      - open_pr
      - validate_pr_review
      - submit_pr_review
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.open_pr.result == 'success' &&
      needs.validate_pr_review.result == 'success' &&
      needs.submit_pr_review.result == 'success' &&
      needs.validate_pr_review.outputs.review_event == 'REQUEST_CHANGES'
    permissions:
      actions: read
      contents: write
      pull-requests: read
    uses: ./.github/workflows/upstream-review-pr-rework.yml
    with:
      round: 1
      base_sha: ${{ github.sha }}
      expected_head_sha: ${{ needs.open_pr.outputs.head_sha }}
      pr_number: ${{ needs.open_pr.outputs.pr_number }}
      pr_url: ${{ needs.open_pr.outputs.pr_url }}
      fix_branch: ${{ needs.publish.outputs.fix_branch }}
      default_branch: ${{ github.event.repository.default_branch }}
      previous_fix_artifact: upstream-review-fix-verified
      previous_review_artifact: upstream-review-pr-review-validated-round-0
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_REASONING_EFFORT: ${{ secrets.OPENAI_REASONING_EFFORT }}
      UPSTREAM_REVIEW_APPROVAL_TOKEN: ${{ secrets.UPSTREAM_REVIEW_APPROVAL_TOKEN }}

  rework_round_2:
    needs:
      - publish
      - open_pr
      - rework_round_1
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.open_pr.result == 'success' &&
      needs.rework_round_1.result == 'success' &&
      needs.rework_round_1.outputs.has_patch == 'true' &&
      needs.rework_round_1.outputs.head_sha != '' &&
      needs.rework_round_1.outputs.review_event == 'REQUEST_CHANGES'
    permissions:
      actions: read
      contents: write
      pull-requests: read
    uses: ./.github/workflows/upstream-review-pr-rework.yml
    with:
      round: 2
      base_sha: ${{ github.sha }}
      expected_head_sha: ${{ needs.rework_round_1.outputs.head_sha }}
      pr_number: ${{ needs.open_pr.outputs.pr_number }}
      pr_url: ${{ needs.open_pr.outputs.pr_url }}
      fix_branch: ${{ needs.publish.outputs.fix_branch }}
      default_branch: ${{ github.event.repository.default_branch }}
      previous_fix_artifact: upstream-review-pr-rework-verified-round-1
      previous_review_artifact: upstream-review-pr-review-validated-round-1
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_REASONING_EFFORT: ${{ secrets.OPENAI_REASONING_EFFORT }}
      UPSTREAM_REVIEW_APPROVAL_TOKEN: ${{ secrets.UPSTREAM_REVIEW_APPROVAL_TOKEN }}

  rework_round_3:
    needs:
      - publish
      - open_pr
      - rework_round_2
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.open_pr.result == 'success' &&
      needs.rework_round_2.result == 'success' &&
      needs.rework_round_2.outputs.has_patch == 'true' &&
      needs.rework_round_2.outputs.head_sha != '' &&
      needs.rework_round_2.outputs.review_event == 'REQUEST_CHANGES'
    permissions:
      actions: read
      contents: write
      pull-requests: read
    uses: ./.github/workflows/upstream-review-pr-rework.yml
    with:
      round: 3
      base_sha: ${{ github.sha }}
      expected_head_sha: ${{ needs.rework_round_2.outputs.head_sha }}
      pr_number: ${{ needs.open_pr.outputs.pr_number }}
      pr_url: ${{ needs.open_pr.outputs.pr_url }}
      fix_branch: ${{ needs.publish.outputs.fix_branch }}
      default_branch: ${{ github.event.repository.default_branch }}
      previous_fix_artifact: upstream-review-pr-rework-verified-round-2
      previous_review_artifact: upstream-review-pr-review-validated-round-2
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_REASONING_EFFORT: ${{ secrets.OPENAI_REASONING_EFFORT }}
      UPSTREAM_REVIEW_APPROVAL_TOKEN: ${{ secrets.UPSTREAM_REVIEW_APPROVAL_TOKEN }}

  rework_limit_summary:
    needs:
      - open_pr
      - rework_round_3
    if: >-
      always() &&
      needs.rework_round_3.result == 'success' &&
      needs.rework_round_3.outputs.review_event == 'REQUEST_CHANGES'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Report bounded rework exhaustion
        env:
          PR_URL: ${{ needs.open_pr.outputs.pr_url }}
          HEAD_SHA: ${{ needs.rework_round_3.outputs.head_sha }}
        run: |
          {
            echo "## Automatic PR rework stopped"
            echo
            echo "The independent reviewer still requested changes after the hard limit of 3 rework rounds."
            echo
            echo "- Draft PR: $PR_URL"
            echo "- Last reviewed head: \`$HEAD_SHA\`"
            echo
            echo "The PR remains draft and blocked for manual follow-up. No further agent round was started."
          } >> "$GITHUB_STEP_SUMMARY"

  finalize_approved_pr:
    needs:
      - publish
      - open_pr
      - validate_pr_review
      - submit_pr_review
      - rework_round_1
      - rework_round_2
      - rework_round_3
    if: >-
      always() &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.open_pr.result == 'success' &&
      (
        (
          needs.validate_pr_review.result == 'success' &&
          needs.submit_pr_review.result == 'success' &&
          needs.validate_pr_review.outputs.review_event == 'APPROVE'
        ) ||
        (
          needs.rework_round_1.result == 'success' &&
          needs.rework_round_1.outputs.has_patch == 'true' &&
          needs.rework_round_1.outputs.head_sha != '' &&
          needs.rework_round_1.outputs.review_event == 'APPROVE'
        ) ||
        (
          needs.rework_round_2.result == 'success' &&
          needs.rework_round_2.outputs.has_patch == 'true' &&
          needs.rework_round_2.outputs.head_sha != '' &&
          needs.rework_round_2.outputs.review_event == 'APPROVE'
        ) ||
        (
          needs.rework_round_3.result == 'success' &&
          needs.rework_round_3.outputs.has_patch == 'true' &&
          needs.rework_round_3.outputs.head_sha != '' &&
          needs.rework_round_3.outputs.review_event == 'APPROVE'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      merge_sha: ${{ steps.merge.outputs.merge_sha }}
      approved_stage: ${{ steps.approved.outputs.approved_stage }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve and verify the exact approved PR snapshot
        id: approved
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_REVIEW_APPROVAL_TOKEN }}
          MERGE_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
          PR_URL: ${{ needs.open_pr.outputs.pr_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIX_BRANCH: ${{ needs.publish.outputs.fix_branch }}
          BASE_SHA: ${{ github.sha }}
          PR_BODY_SHA256: ${{ needs.open_pr.outputs.pr_body_sha256 }}
          INITIAL_VALIDATE_RESULT: ${{ needs.validate_pr_review.result }}
          INITIAL_SUBMIT_RESULT: ${{ needs.submit_pr_review.result }}
          INITIAL_EVENT: ${{ needs.validate_pr_review.outputs.review_event }}
          INITIAL_HEAD_SHA: ${{ needs.open_pr.outputs.head_sha }}
          ROUND_1_RESULT: ${{ needs.rework_round_1.result }}
          ROUND_1_HAS_PATCH: ${{ needs.rework_round_1.outputs.has_patch }}
          ROUND_1_EVENT: ${{ needs.rework_round_1.outputs.review_event }}
          ROUND_1_HEAD_SHA: ${{ needs.rework_round_1.outputs.head_sha }}
          ROUND_2_RESULT: ${{ needs.rework_round_2.result }}
          ROUND_2_HAS_PATCH: ${{ needs.rework_round_2.outputs.has_patch }}
          ROUND_2_EVENT: ${{ needs.rework_round_2.outputs.review_event }}
          ROUND_2_HEAD_SHA: ${{ needs.rework_round_2.outputs.head_sha }}
          ROUND_3_RESULT: ${{ needs.rework_round_3.result }}
          ROUND_3_HAS_PATCH: ${{ needs.rework_round_3.outputs.has_patch }}
          ROUND_3_EVENT: ${{ needs.rework_round_3.outputs.review_event }}
          ROUND_3_HEAD_SHA: ${{ needs.rework_round_3.outputs.head_sha }}
        run: |
          candidate_count=0
          approved_stage=""
          approved_head_sha=""

          select_candidate() {
            stage="$1"
            result="$2"
            has_patch="$3"
            event="$4"
            head_sha="$5"
            if [ "$result" != "success" ] || [ "$event" != "APPROVE" ]; then
              return
            fi
            if [ "$has_patch" != "true" ]; then
              echo "Approved $stage did not produce a validated patch." >&2
              exit 1
            fi
            candidate_count=$((candidate_count + 1))
            approved_stage="$stage"
            approved_head_sha="$head_sha"
          }

          if \
            [ "$INITIAL_VALIDATE_RESULT" = "success" ] &&
            [ "$INITIAL_SUBMIT_RESULT" = "success" ]
          then
            select_candidate \
              "initial-review" \
              "$INITIAL_SUBMIT_RESULT" \
              "true" \
              "$INITIAL_EVENT" \
              "$INITIAL_HEAD_SHA"
          fi
          select_candidate \
            "rework-round-1" \
            "$ROUND_1_RESULT" \
            "$ROUND_1_HAS_PATCH" \
            "$ROUND_1_EVENT" \
            "$ROUND_1_HEAD_SHA"
          select_candidate \
            "rework-round-2" \
            "$ROUND_2_RESULT" \
            "$ROUND_2_HAS_PATCH" \
            "$ROUND_2_EVENT" \
            "$ROUND_2_HEAD_SHA"
          select_candidate \
            "rework-round-3" \
            "$ROUND_3_RESULT" \
            "$ROUND_3_HAS_PATCH" \
            "$ROUND_3_EVENT" \
            "$ROUND_3_HEAD_SHA"

          if [ "$candidate_count" -ne 1 ]; then
            echo "Expected exactly one approved terminal review; found $candidate_count." >&2
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] ||
             ! [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] ||
             ! [[ "$approved_head_sha" =~ ^[a-f0-9]{40}$ ]] ||
             ! [[ "$FIX_BRANCH" =~ ^codex/upstream-review-[a-f0-9]{16}-i[1-9][0-9]*-b[a-f0-9]{12}$ ]] ||
             ! [[ "$PR_BODY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          then
            echo "Invalid trusted automatic PR identity." >&2
            exit 1
          fi

          expected_pr_url="https://github.com/$GH_REPO/pull/$PR_NUMBER"
          if [ "$PR_URL" != "$expected_pr_url" ]; then
            echo "The automatic PR URL does not match its trusted repository and number." >&2
            exit 1
          fi

          reviewer_login="$(gh api user --jq .login)"
          if ! [[ "$reviewer_login" =~ ^[A-Za-z0-9-]{1,39}$ ]] ||
             [ "$reviewer_login" = "github-actions[bot]" ]
          then
            echo "Invalid independent reviewer identity." >&2
            exit 1
          fi

          reviewer_repository_path="$RUNNER_TEMP/upstream-review-reviewer-repository.json"
          if ! gh api "repos/$GH_REPO" > "$reviewer_repository_path"; then
            echo "The reviewer repository role could not be verified." >&2
            exit 1
          fi
          if ! jq -e '.permissions.admin == true' "$reviewer_repository_path" >/dev/null; then
            echo "The approval-token identity no longer has admin access to $GH_REPO." >&2
            exit 1
          fi

          merge_repository_path="$RUNNER_TEMP/upstream-review-merge-repository.json"
          if ! GH_TOKEN="$MERGE_TOKEN" gh api "repos/$GH_REPO" > "$merge_repository_path"; then
            echo "The repository merge configuration could not be verified with GITHUB_TOKEN." >&2
            exit 1
          fi
          if ! jq -e '.allow_squash_merge == true' "$merge_repository_path" >/dev/null; then
            echo "Squash merge is no longer enabled for $GH_REPO." >&2
            exit 1
          fi

          protection_path="$RUNNER_TEMP/upstream-review-merge-protection.json"
          gh api "repos/$GH_REPO/branches/$DEFAULT_BRANCH/protection" > "$protection_path"
          if ! jq -e '
            (.required_pull_request_reviews.required_approving_review_count // 0) >= 1 and
            (
              .required_pull_request_reviews.dismiss_stale_reviews == true or
              .required_pull_request_reviews.require_last_push_approval == true
            )
          ' "$protection_path" >/dev/null
          then
            echo "The default branch no longer protects exact-head approvals." >&2
            exit 1
          fi

          pr_path="$RUNNER_TEMP/upstream-review-approved-pr.json"
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$pr_path"
          actual_pr_body_sha256="$(
            jq -j '.body // ""' "$pr_path" |
              /usr/bin/sha256sum |
              /usr/bin/cut -d ' ' -f 1
          )"
          if [ "$actual_pr_body_sha256" != "$PR_BODY_SHA256" ]; then
            echo "The approved automatic PR body no longer matches its trusted rendering." >&2
            exit 1
          fi
          if ! jq -e \
            --argjson number "$PR_NUMBER" \
            --arg url "$PR_URL" \
            --arg repo "$GH_REPO" \
            --arg base_ref "$DEFAULT_BRANCH" \
            --arg base_sha "$BASE_SHA" \
            --arg head_ref "$FIX_BRANCH" \
            --arg head_sha "$approved_head_sha" \
            '
              .number == $number and
              .html_url == $url and
              .state == "open" and
              .merged == false and
              .draft == true and
              .user.login == "github-actions[bot]" and
              .base.repo.full_name == $repo and
              .base.ref == $base_ref and
              .base.sha == $base_sha and
              .head.repo.full_name == $repo and
              .head.ref == $head_ref and
              .head.sha == $head_sha
            ' \
            "$pr_path" >/dev/null
          then
            echo "The approved automatic PR no longer matches its trusted snapshot." >&2
            exit 1
          fi

          reviews_path="$RUNNER_TEMP/upstream-review-approved-reviews.json"
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews?per_page=100" > "$reviews_path"
          if ! jq -e \
            --arg login "$reviewer_login" \
            --arg commit "$approved_head_sha" \
            '
              [
                .[] |
                select(
                  .user.login == $login and
                  .commit_id == $commit and
                  (.state == "APPROVED" or .state == "CHANGES_REQUESTED")
                )
              ] |
              sort_by(.submitted_at, .id) |
              last |
              .state == "APPROVED"
            ' \
            "$reviews_path" >/dev/null
          then
            echo "The independent reviewer has not approved the exact terminal head." >&2
            exit 1
          fi

          echo "approved_stage=$approved_stage" >> "$GITHUB_OUTPUT"
          echo "head_sha=$approved_head_sha" >> "$GITHUB_OUTPUT"
          echo "reviewer_login=$reviewer_login" >> "$GITHUB_OUTPUT"

      - name: Mark ready and squash-merge the approved head
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
          PR_URL: ${{ needs.open_pr.outputs.pr_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIX_BRANCH: ${{ needs.publish.outputs.fix_branch }}
          BASE_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ steps.approved.outputs.head_sha }}
          APPROVED_STAGE: ${{ steps.approved.outputs.approved_stage }}
          REVIEWER_LOGIN: ${{ steps.approved.outputs.reviewer_login }}
          PR_BODY_SHA256: ${{ needs.open_pr.outputs.pr_body_sha256 }}
        run: |
          verify_default_tip() {
            current_tip="$(gh api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)"
            if [ "$current_tip" != "$BASE_SHA" ]; then
              echo "The default branch changed before the approved PR could be merged." >&2
              exit 1
            fi
          }

          verify_exact_approval() {
            reviews_path="$1"
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews?per_page=100" > "$reviews_path"
            if ! jq -e \
              --arg login "$REVIEWER_LOGIN" \
              --arg commit "$HEAD_SHA" \
              '
                [
                  .[] |
                  select(
                    .user.login == $login and
                    .commit_id == $commit and
                    (.state == "APPROVED" or .state == "CHANGES_REQUESTED")
                  )
                ] |
                sort_by(.submitted_at, .id) |
                last |
                .state == "APPROVED"
              ' \
              "$reviews_path" >/dev/null
            then
              echo "The exact-head approval changed before merge." >&2
              exit 1
            fi
          }

          verify_pr_state() {
            pr_path="$1"
            expected_draft="$2"
            gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$pr_path"
            if ! jq -e \
              --argjson number "$PR_NUMBER" \
              --arg url "$PR_URL" \
              --arg repo "$GH_REPO" \
              --arg base_ref "$DEFAULT_BRANCH" \
              --arg base_sha "$BASE_SHA" \
              --arg head_ref "$FIX_BRANCH" \
              --arg head_sha "$HEAD_SHA" \
              --argjson draft "$expected_draft" \
              '
                .number == $number and
                .html_url == $url and
                .state == "open" and
                .merged == false and
                .draft == $draft and
                .user.login == "github-actions[bot]" and
                .base.repo.full_name == $repo and
                .base.ref == $base_ref and
                .base.sha == $base_sha and
                .head.repo.full_name == $repo and
                .head.ref == $head_ref and
                .head.sha == $head_sha
              ' \
              "$pr_path" >/dev/null
            then
              echo "The automatic PR no longer matches its trusted snapshot." >&2
              exit 1
            fi
            actual_pr_body_sha256="$(
              jq -j '.body // ""' "$pr_path" |
                /usr/bin/sha256sum |
                /usr/bin/cut -d ' ' -f 1
            )"
            if [ "$actual_pr_body_sha256" != "$PR_BODY_SHA256" ]; then
              echo "The automatic PR body changed before merge." >&2
              exit 1
            fi
          }

          verify_default_tip
          verify_pr_state "$RUNNER_TEMP/upstream-review-before-ready.json" true
          verify_exact_approval "$RUNNER_TEMP/upstream-review-before-ready-reviews.json"

          jq -n \
            --arg sha "$HEAD_SHA" \
            '{sha: $sha, merge_method: "squash"}' \
            > "$RUNNER_TEMP/upstream-review-merge-request.json"

          ready_transitioned=false
          restore_draft_on_failure() {
            exit_code="$?"
            trap - EXIT
            if [ "$exit_code" -ne 0 ] && [ "$ready_transitioned" = "true" ]; then
              set +e
              gh api "repos/$GH_REPO/pulls/$PR_NUMBER" \
                > "$RUNNER_TEMP/upstream-review-ready-failure.json"
              if jq -e \
                --arg head_sha "$HEAD_SHA" \
                '
                  .state == "open" and
                  .merged == false and
                  .draft == false and
                  .head.sha == $head_sha
                ' \
                "$RUNNER_TEMP/upstream-review-ready-failure.json" >/dev/null
              then
                gh pr ready "$PR_NUMBER" --repo "$GH_REPO" --undo >/dev/null
              fi
            fi
            exit "$exit_code"
          }
          trap restore_draft_on_failure EXIT

          gh pr ready "$PR_NUMBER" --repo "$GH_REPO"
          ready_transitioned=true

          verify_pr_state "$RUNNER_TEMP/upstream-review-after-ready.json" false
          verify_exact_approval "$RUNNER_TEMP/upstream-review-after-ready-reviews.json"
          verify_default_tip
          gh api \
            --method PUT \
            "repos/$GH_REPO/pulls/$PR_NUMBER/merge" \
            --input "$RUNNER_TEMP/upstream-review-merge-request.json" \
            > "$RUNNER_TEMP/upstream-review-merge-response.json"
          if ! jq -e '
            .merged == true and
            (.sha | type == "string" and test("^[a-f0-9]{40}$"))
          ' "$RUNNER_TEMP/upstream-review-merge-response.json" >/dev/null
          then
            echo "GitHub did not confirm the exact-head squash merge." >&2
            exit 1
          fi

          merge_sha="$(jq -r .sha "$RUNNER_TEMP/upstream-review-merge-response.json")"
          gh api "repos/$GH_REPO/git/commits/$merge_sha" \
            > "$RUNNER_TEMP/upstream-review-merge-commit.json"
          if ! jq -e \
            --arg base_sha "$BASE_SHA" \
            '
              (.parents | length) == 1 and
              .parents[0].sha == $base_sha
            ' \
            "$RUNNER_TEMP/upstream-review-merge-commit.json" >/dev/null
          then
            echo "The squash commit was not created directly on the reviewed base." >&2
            exit 1
          fi

          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" \
            > "$RUNNER_TEMP/upstream-review-merged-pr.json"
          if ! jq -e \
            --arg head_sha "$HEAD_SHA" \
            '
              .state == "closed" and
              .merged == true and
              .draft == false and
              .head.sha == $head_sha
            ' \
            "$RUNNER_TEMP/upstream-review-merged-pr.json" >/dev/null
          then
            echo "The pull request did not reach the expected merged state." >&2
            exit 1
          fi

          ready_transitioned=false
          trap - EXIT
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Approved PR merged"
            echo
            echo "- PR: $PR_URL"
            echo "- Approved stage: \`$APPROVED_STAGE\`"
            echo "- Reviewed head: \`$HEAD_SHA\`"
            echo "- Squash commit: \`$merge_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

  finalize_remediation_issue:
    needs:
      - publish
      - open_pr
      - finalize_approved_pr
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.publish.result == 'success' &&
      needs.open_pr.result == 'success' &&
      needs.finalize_approved_pr.result == 'success' &&
      needs.finalize_approved_pr.outputs.merged == 'true' &&
      needs.finalize_approved_pr.outputs.merge_sha != '' &&
      needs.publish.outputs.issue_number != '' &&
      needs.publish.outputs.remediation_cycle != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Download finalized review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review
          path: ${{ runner.temp }}/upstream-review

      - name: Download verified fix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-review-fix-verified
          path: ${{ runner.temp }}/upstream-review-fix-verified

      - name: Finalize the merged remediation Issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REVIEW_BASE_SHA: ${{ github.sha }}
          UPSTREAM_REVIEW_REPORT_PATH: ${{ runner.temp }}/upstream-review/upstream-review.json
          UPSTREAM_REVIEW_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-input.json
          UPSTREAM_REVIEW_FIX_AGENT_OUTPUT_PATH: ${{ runner.temp }}/upstream-review-fix-verified/upstream-review-fix-agent.json
          UPSTREAM_REVIEW_FIX_MANIFEST_PATH: ${{ runner.temp }}/upstream-review-fix-verified/manifest.json
          UPSTREAM_REVIEW_FIX_PATCH_PATH: ${{ runner.temp }}/upstream-review-fix-verified/fix.patch
          UPSTREAM_REVIEW_ISSUE_NUMBER: ${{ needs.publish.outputs.issue_number }}
          UPSTREAM_REVIEW_ISSUE_URL: ${{ needs.publish.outputs.issue_url }}
          UPSTREAM_REVIEW_FINDING_FINGERPRINT: ${{ needs.publish.outputs.finding_fingerprint }}
          UPSTREAM_REVIEW_REMEDIATION_CYCLE: ${{ needs.publish.outputs.remediation_cycle }}
          UPSTREAM_REVIEW_PR_NUMBER: ${{ needs.open_pr.outputs.pr_number }}
          UPSTREAM_REVIEW_PR_URL: ${{ needs.open_pr.outputs.pr_url }}
          UPSTREAM_REVIEW_PR_BODY_SHA256: ${{ needs.open_pr.outputs.pr_body_sha256 }}
          UPSTREAM_REVIEW_MERGE_SHA: ${{ needs.finalize_approved_pr.outputs.merge_sha }}
          UPSTREAM_REVIEW_APPROVED_STAGE: ${{ needs.finalize_approved_pr.outputs.approved_stage }}
          UPSTREAM_REVIEW_ALL_FINDINGS_ADDRESSED: ${{ needs.open_pr.outputs.all_findings_addressed }}
        run: node scripts/review-upstream.mjs --finalize-remediation-issue
