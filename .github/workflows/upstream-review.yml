name: Upstream Review

on:
  workflow_dispatch:

concurrency:
  group: upstream-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 9.9.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-lockfile

      - name: Start local API
        run: nohup pnpm --filter @game-cal/api exec tsx src/index.ts > "$RUNNER_TEMP/api.log" 2>&1 &

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Collect review input
        env:
          UPSTREAM_REVIEW_API_BASE_URL: http://127.0.0.1:8787
          UPSTREAM_REVIEW_INPUT_PATH: artifacts/upstream-review-input.json
        run: pnpm review:upstream:collect

      - name: Upload review input
        uses: actions/upload-artifact@v7
        with:
          name: upstream-review-input
          path: artifacts/upstream-review-input.json
          if-no-files-found: error

      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-review-api-log
          path: ${{ runner.temp }}/api.log
          if-no-files-found: warn

  review:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download review input
        uses: actions/download-artifact@v8
        with:
          name: upstream-review-input
          path: artifacts

      - name: Review with Codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}
          model: ${{ secrets.OPENAI_MODEL }}
          effort: ${{ secrets.OPENAI_REASONING_EFFORT }}
          prompt-file: .github/prompts/upstream-review.md
          output-schema-file: .github/schemas/upstream-review-output.schema.json
          output-file: artifacts/upstream-review-agent.json
          codex-version: "0.145.0"
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

      - name: Upload Codex review
        uses: actions/upload-artifact@v7
        with:
          name: upstream-review-agent
          path: artifacts/upstream-review-agent.json
          if-no-files-found: error

  publish:
    needs: review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 25

      - name: Download review input
        uses: actions/download-artifact@v8
        with:
          name: upstream-review-input
          path: artifacts

      - name: Download Codex review
        uses: actions/download-artifact@v8
        with:
          name: upstream-review-agent
          path: artifacts

      - name: Validate result and sync issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPSTREAM_REVIEW_INPUT_PATH: artifacts/upstream-review-input.json
          UPSTREAM_REVIEW_AGENT_OUTPUT_PATH: artifacts/upstream-review-agent.json
          UPSTREAM_REVIEW_REPORT_PATH: artifacts/upstream-review.json
          UPSTREAM_REVIEW_ISSUE_NUMBER: "1"
          UPSTREAM_REVIEW_ISSUE_TITLE: Upstream Review Alerts
        run: node scripts/review-upstream.mjs --finalize

      - name: Upload final review artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-review
          path: artifacts
          if-no-files-found: warn
