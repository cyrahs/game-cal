name: Upstream Agentic Attempt

on:
  workflow_call:
    inputs:
      attempt:
        required: true
        type: number
      max_attempts:
        required: true
        type: number
      base_sha:
        required: true
        type: string
      start_sha:
        required: true
        type: string
      source_artifact:
        required: true
        type: string
      previous_candidate_artifact:
        required: false
        type: string
        default: ""
      previous_feedback_artifact:
        required: false
        type: string
        default: ""
      previous_head_sha:
        required: false
        type: string
        default: ""
      pr_number:
        required: false
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        required: true
      OPENAI_BASE_URL:
        required: true
      OPENAI_MODEL:
        required: true
      OPENAI_REASONING_EFFORT:
        required: true
      UPSTREAM_REVIEW_APPROVAL_TOKEN:
        required: true
    outputs:
      disposition:
        value: ${{ jobs.resolve.outputs.disposition }}
      cycle_id:
        value: ${{ jobs.repair.outputs.cycle_id }}
      candidate_artifact:
        value: ${{ jobs.resolve.outputs.candidate_artifact }}
      feedback_artifact:
        value: ${{ jobs.resolve.outputs.feedback_artifact }}
      head_sha:
        value: ${{ jobs.resolve.outputs.head_sha }}
      pr_number:
        value: ${{ jobs.resolve.outputs.pr_number }}
      pr_url:
        value: ${{ jobs.resolve.outputs.pr_url }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      cycle_id: ${{ steps.prepare.outputs.cycle_id }}
      result_tree: ${{ steps.finalize.outputs.result_tree }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.start_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Download immutable finding source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.source_artifact }}
          path: ${{ runner.temp }}/upstream-agentic-source

      - name: Download previous candidate
        if: inputs.previous_candidate_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.previous_candidate_artifact }}
          path: ${{ runner.temp }}/upstream-agentic-previous-candidate

      - name: Download previous feedback
        if: inputs.previous_feedback_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.previous_feedback_artifact }}
          path: ${{ runner.temp }}/upstream-agentic-previous-feedback

      - name: Restore unpublished candidate
        if: inputs.previous_candidate_artifact != '' && inputs.previous_head_sha == ''
        run: |
          git apply --check "$RUNNER_TEMP/upstream-agentic-previous-candidate/cumulative.patch"
          git apply "$RUNNER_TEMP/upstream-agentic-previous-candidate/cumulative.patch"

      - name: Prepare trusted attempt request
        id: prepare
        env:
          AGENTIC_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-agentic-source/upstream-review-fix-input.json
          AGENTIC_FEEDBACK_PATH: ${{ inputs.previous_feedback_artifact != '' && format('{0}/upstream-agentic-previous-feedback/feedback.json', runner.temp) || '' }}
          AGENTIC_ATTEMPT_INPUT_PATH: artifacts/upstream-agentic-attempt-input.json
          AGENTIC_CYCLE_PATH: ${{ runner.temp }}/upstream-agentic-cycle.json
          AGENTIC_ATTEMPT: ${{ inputs.attempt }}
          AGENTIC_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          AGENTIC_START_SHA: ${{ inputs.start_sha }}
        run: |
          mkdir -p artifacts
          echo 'artifacts/' >> .git/info/exclude
          node scripts/upstream-agentic-artifact.mjs prepare-attempt

      - name: Repair with Codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}
          model: ${{ secrets.OPENAI_MODEL }}
          effort: ${{ secrets.OPENAI_REASONING_EFFORT }}
          prompt-file: .github/prompts/upstream-agentic-repair.md
          output-schema-file: .github/schemas/upstream-agentic-repair-output.schema.json
          output-file: artifacts/upstream-agentic-repair-output.json
          codex-version: "0.145.0"
          permission-profile: ":workspace"
          safety-strategy: drop-sudo

      - name: Enforce patch policy and export candidate
        id: finalize
        env:
          AGENTIC_ATTEMPT_INPUT_PATH: artifacts/upstream-agentic-attempt-input.json
          AGENTIC_AGENT_OUTPUT_PATH: artifacts/upstream-agentic-repair-output.json
          AGENTIC_CANDIDATE_DIRECTORY: ${{ runner.temp }}/upstream-agentic-candidate
        run: |
          mkdir -p "$AGENTIC_CANDIDATE_DIRECTORY"
          node scripts/upstream-agentic-artifact.mjs finalize-candidate

      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-agentic-candidate-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-candidate
          if-no-files-found: error

  validate:
    needs: repair
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    outputs:
      disposition: ${{ steps.classify.outputs.disposition }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.9.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          cache: pnpm

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-agentic-candidate-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-candidate

      - name: Reconstruct cumulative candidate
        run: |
          test "$(sha256sum "$RUNNER_TEMP/upstream-agentic-candidate/cumulative.patch" | cut -d ' ' -f 1)" = "$(jq -r .cumulative_patch_sha256 "$RUNNER_TEMP/upstream-agentic-candidate/manifest.json")"
          git apply --check "$RUNNER_TEMP/upstream-agentic-candidate/cumulative.patch"
          git apply "$RUNNER_TEMP/upstream-agentic-candidate/cumulative.patch"

      - name: Install trusted dependencies
        run: pnpm install --frozen-lockfile

      - name: Test workflow safeguards
        id: safeguards
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:upstream-review 2>&1 | tee "$RUNNER_TEMP/safeguards.log"

      - name: Test parser regressions
        id: parsers
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm test:game-parsers 2>&1 | tee "$RUNNER_TEMP/parsers.log"

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/typecheck.log"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Record executed gates
        env:
          SAFEGUARDS_OUTCOME: ${{ steps.safeguards.outcome }}
          PARSERS_OUTCOME: ${{ steps.parsers.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          jq -n \
            --arg safeguards "$SAFEGUARDS_OUTCOME" \
            --arg parsers "$PARSERS_OUTCOME" \
            --arg typecheck "$TYPECHECK_OUTCOME" \
            --arg build "$BUILD_OUTCOME" \
            --rawfile safeguards_log "$RUNNER_TEMP/safeguards.log" \
            --rawfile parsers_log "$RUNNER_TEMP/parsers.log" \
            --rawfile typecheck_log "$RUNNER_TEMP/typecheck.log" \
            --rawfile build_log "$RUNNER_TEMP/build.log" \
            '{
              safeguards: {executed: true, outcome: $safeguards, message: ($safeguards_log[-2000:])},
              parsers: {executed: true, outcome: $parsers, message: ($parsers_log[-2000:])},
              typecheck: {executed: true, outcome: $typecheck, message: ($typecheck_log[-2000:])},
              build: {executed: true, outcome: $build, message: ($build_log[-2000:])}
            }' > "$RUNNER_TEMP/upstream-agentic-gates.json"

      - name: Classify validation result
        id: classify
        env:
          AGENTIC_GATES_PATH: ${{ runner.temp }}/upstream-agentic-gates.json
          AGENTIC_CYCLE_ID: ${{ needs.repair.outputs.cycle_id }}
          AGENTIC_ATTEMPT: ${{ inputs.attempt }}
          AGENTIC_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          AGENTIC_FEEDBACK_PATH: ${{ runner.temp }}/upstream-agentic-validation/feedback.json
          AGENTIC_DECISION_PATH: ${{ runner.temp }}/upstream-agentic-validation/decision.json
        run: |
          mkdir -p "$RUNNER_TEMP/upstream-agentic-validation"
          cp "$RUNNER_TEMP/upstream-agentic-gates.json" "$RUNNER_TEMP/upstream-agentic-validation/validation.json"
          node scripts/upstream-agentic-state.mjs classify-validation

      - name: Upload validation receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-agentic-validation-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-validation
          if-no-files-found: error

      - name: Upload validation feedback
        if: steps.classify.outputs.disposition != 'review'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-agentic-feedback-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-validation/feedback.json
          if-no-files-found: error

  publish:
    needs:
      - repair
      - validate
    if: needs.validate.outputs.disposition == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      head_sha: ${{ steps.publish.outputs.head_sha }}
      pr_number: ${{ steps.publish.outputs.pr_number }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.start_sha }}
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-agentic-candidate-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-candidate

      - name: Download immutable finding source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.source_artifact }}
          path: ${{ runner.temp }}/upstream-agentic-source

      - name: Publish exact candidate head
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ inputs.base_sha }}
          START_SHA: ${{ inputs.start_sha }}
          PREVIOUS_HEAD_SHA: ${{ inputs.previous_head_sha }}
          EXISTING_PR_NUMBER: ${{ inputs.pr_number }}
          ATTEMPT: ${{ inputs.attempt }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          CYCLE_ID: ${{ needs.repair.outputs.cycle_id }}
        run: |
          manifest="$RUNNER_TEMP/upstream-agentic-candidate/manifest.json"
          fix_input="$RUNNER_TEMP/upstream-agentic-source/upstream-review-fix-input.json"
          branch="$(jq -r .fix_branch "$fix_input")"
          issue_number="$(jq -r .source_report.issue_number "$fix_input")"
          test "$(jq -r .base_sha "$manifest")" = "$BASE_SHA"
          test "$(jq -r .start_sha "$manifest")" = "$START_SHA"

          if [ -n "$PREVIOUS_HEAD_SHA" ]; then
            remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f 1)"
            test "$remote_head" = "$PREVIOUS_HEAD_SHA"
            test "$START_SHA" = "$PREVIOUS_HEAD_SHA"
          fi

          git apply --check "$RUNNER_TEMP/upstream-agentic-candidate/incremental.patch"
          git apply --index "$RUNNER_TEMP/upstream-agentic-candidate/incremental.patch"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: repair upstream findings (attempt $((ATTEMPT + 1)))"
          head_sha="$(git rev-parse HEAD)"
          test "$(git show -s --format=%T HEAD)" = "$(jq -r .result_tree "$manifest")"
          git push origin "HEAD:refs/heads/$branch"

          body_path="$RUNNER_TEMP/upstream-agentic-pr-body.md"
          AGENTIC_FIX_INPUT_PATH="$fix_input" \
          AGENTIC_CYCLE_ID="$CYCLE_ID" \
          AGENTIC_MAX_ATTEMPTS="$MAX_ATTEMPTS" \
          AGENTIC_PR_BODY_PATH="$body_path" \
            node scripts/upstream-agentic-artifact.mjs render-pr-body

          if [ -z "$EXISTING_PR_NUMBER" ]; then
            pr_url="$(gh pr create --repo "$GH_REPO" --base "${{ github.event.repository.default_branch }}" --head "$branch" --draft --title "fix: repair confirmed upstream findings" --body-file "$body_path")"
            pr_number="${pr_url##*/}"
          else
            pr_number="$EXISTING_PR_NUMBER"
            gh api "repos/$GH_REPO/pulls/$pr_number" > "$RUNNER_TEMP/pr.json"
            jq -e --arg branch "$branch" --arg head "$head_sha" '.state == "open" and .head.ref == $branch and .head.sha == $head' "$RUNNER_TEMP/pr.json" >/dev/null
            gh pr edit "$pr_number" --repo "$GH_REPO" --body-file "$body_path"
            pr_url="$(jq -r .html_url "$RUNNER_TEMP/pr.json")"
          fi

          gh api --method POST "repos/$GH_REPO/statuses/$head_sha" \
            -f state=success \
            -f context='upstream-agentic/validate' \
            -f description="Attempt $((ATTEMPT + 1)) passed every trusted gate" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Published attempt $((ATTEMPT + 1)) to $pr_url at $head_sha" >> "$GITHUB_STEP_SUMMARY"

  review:
    needs:
      - repair
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      disposition: ${{ steps.classify.outputs.disposition }}
      context_sha256: ${{ steps.prepare.outputs.context_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.publish.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25

      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: upstream-agentic-candidate-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-candidate

      - name: Download immutable finding source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.source_artifact }}
          path: ${{ runner.temp }}/upstream-agentic-source

      - name: Prepare exact-head review context
        id: prepare
        env:
          AGENTIC_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-agentic-source/upstream-review-fix-input.json
          AGENTIC_MANIFEST_PATH: ${{ runner.temp }}/upstream-agentic-candidate/manifest.json
          AGENTIC_PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          AGENTIC_HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          AGENTIC_REVIEW_INPUT_PATH: artifacts/upstream-agentic-review-input.json
        run: |
          mkdir -p artifacts
          echo 'artifacts/' >> .git/info/exclude
          node scripts/upstream-agentic-artifact.mjs prepare-review
          test "$(git rev-parse HEAD)" = "$AGENTIC_HEAD_SHA"

      - name: Independently review with Codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}
          model: ${{ secrets.OPENAI_MODEL }}
          effort: ${{ secrets.OPENAI_REASONING_EFFORT }}
          prompt-file: .github/prompts/upstream-agentic-review.md
          output-schema-file: .github/schemas/upstream-agentic-review-output.schema.json
          output-file: artifacts/upstream-agentic-review-output.json
          codex-version: "0.145.0"
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

      - name: Validate and classify review evidence
        id: classify
        env:
          AGENTIC_CYCLE_ID: ${{ needs.repair.outputs.cycle_id }}
          AGENTIC_ATTEMPT: ${{ inputs.attempt }}
          AGENTIC_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          AGENTIC_HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          AGENTIC_REVIEW_INPUT_PATH: artifacts/upstream-agentic-review-input.json
          AGENTIC_REVIEW_PATH: artifacts/upstream-agentic-review-output.json
          AGENTIC_FEEDBACK_PATH: ${{ runner.temp }}/upstream-agentic-review/feedback.json
          AGENTIC_DECISION_PATH: ${{ runner.temp }}/upstream-agentic-review/decision.json
        run: |
          mkdir -p "$RUNNER_TEMP/upstream-agentic-review"
          cp artifacts/upstream-agentic-review-input.json "$RUNNER_TEMP/upstream-agentic-review/input.json"
          cp artifacts/upstream-agentic-review-output.json "$RUNNER_TEMP/upstream-agentic-review/review.json"
          node scripts/upstream-agentic-state.mjs classify-review

      - name: Upload review receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-agentic-review-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-review
          if-no-files-found: error

      - name: Upload review feedback
        if: steps.classify.outputs.disposition != 'approved'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-agentic-feedback-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-review/feedback.json
          if-no-files-found: error

  runtime:
    needs:
      - repair
      - publish
      - review
    if: needs.review.outputs.disposition == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZZZ_SNAPSHOT_API_URL: https://gamecal.nv5.me/api/upstream/zzz/snapshot
    permissions:
      actions: read
      contents: read
    outputs:
      disposition: ${{ steps.classify.outputs.disposition }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.publish.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.9.0
          run_install: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 25
          cache: pnpm

      - name: Download immutable finding source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.source_artifact }}
          path: ${{ runner.temp }}/upstream-agentic-source

      - run: pnpm install --frozen-lockfile

      - name: Start exact-head API
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.publish.outputs.head_sha }}"
          nohup pnpm --filter @game-cal/api exec tsx src/index.ts > "$RUNNER_TEMP/runtime-api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/runtime-api.pid"

      - name: Wait for exact-head API
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -n 200 "$RUNNER_TEMP/runtime-api.log"
          exit 1

      - name: Freeze exact-head finding replay
        id: prepare
        env:
          AGENTIC_FIX_INPUT_PATH: ${{ runner.temp }}/upstream-agentic-source/upstream-review-fix-input.json
          AGENTIC_CYCLE_ID: ${{ needs.repair.outputs.cycle_id }}
          AGENTIC_ATTEMPT: ${{ inputs.attempt }}
          AGENTIC_HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          AGENTIC_API_BASE_URL: http://127.0.0.1:8787
          AGENTIC_RUNTIME_INPUT_PATH: artifacts/upstream-agentic-runtime-input.json
        run: |
          mkdir -p artifacts
          echo 'artifacts/' >> .git/info/exclude
          node scripts/upstream-agentic-artifact.mjs prepare-runtime

      - name: Verify original findings against exact-head runtime
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          responses-api-endpoint: ${{ secrets.OPENAI_BASE_URL }}
          model: ${{ secrets.OPENAI_MODEL }}
          effort: ${{ secrets.OPENAI_REASONING_EFFORT }}
          prompt-file: .github/prompts/upstream-agentic-runtime.md
          output-schema-file: .github/schemas/upstream-agentic-runtime-output.schema.json
          output-file: artifacts/upstream-agentic-runtime-output.json
          codex-version: "0.145.0"
          permission-profile: ":read-only"
          safety-strategy: drop-sudo

      - name: Classify exact-head runtime replay
        id: classify
        env:
          AGENTIC_CYCLE_ID: ${{ needs.repair.outputs.cycle_id }}
          AGENTIC_ATTEMPT: ${{ inputs.attempt }}
          AGENTIC_MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          AGENTIC_HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          AGENTIC_RUNTIME_INPUT_PATH: artifacts/upstream-agentic-runtime-input.json
          AGENTIC_RUNTIME_PATH: artifacts/upstream-agentic-runtime-output.json
          AGENTIC_FEEDBACK_PATH: ${{ runner.temp }}/upstream-agentic-runtime/feedback.json
          AGENTIC_DECISION_PATH: ${{ runner.temp }}/upstream-agentic-runtime/decision.json
        run: |
          mkdir -p "$RUNNER_TEMP/upstream-agentic-runtime"
          cp artifacts/upstream-agentic-runtime-input.json "$RUNNER_TEMP/upstream-agentic-runtime/input.json"
          cp artifacts/upstream-agentic-runtime-output.json "$RUNNER_TEMP/upstream-agentic-runtime/runtime.json"
          node scripts/upstream-agentic-state.mjs classify-runtime

      - name: Upload runtime receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-agentic-runtime-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-runtime
          if-no-files-found: error

      - name: Upload runtime feedback
        if: steps.classify.outputs.disposition != 'approved'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-agentic-feedback-${{ inputs.attempt }}
          path: ${{ runner.temp }}/upstream-agentic-runtime/feedback.json
          if-no-files-found: error

      - name: Stop exact-head API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/runtime-api.pid" ]; then
            pid="$(cat "$RUNNER_TEMP/runtime-api.pid")"
            if kill -0 "$pid" 2>/dev/null; then kill -TERM "$pid"; fi
          fi

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-agentic-runtime-log-${{ inputs.attempt }}
          path: ${{ runner.temp }}/runtime-api.log
          if-no-files-found: warn

  submit_review:
    needs:
      - publish
      - review
      - runtime
    if: >-
      always() &&
      needs.publish.result == 'success' &&
      needs.review.result == 'success' &&
      (
        needs.review.outputs.disposition != 'approved' ||
        needs.runtime.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Submit exact-head review from independent identity
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_REVIEW_APPROVAL_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          DISPOSITION: ${{ needs.review.outputs.disposition }}
          RUNTIME_DISPOSITION: ${{ needs.runtime.outputs.disposition }}
          CONTEXT_SHA256: ${{ needs.review.outputs.context_sha256 }}
        run: |
          test "$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)" = "$HEAD_SHA"
          reviewer="$(gh api user --jq .login)"
          author="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .user.login)"
          test "$reviewer" != "$author"

          event=REQUEST_CHANGES
          body="Automated independent review requested another bounded repair attempt. Context: $CONTEXT_SHA256"
          if [ "$DISPOSITION" = "approved" ] && [ "$RUNTIME_DISPOSITION" = "approved" ]; then
            event=APPROVE
            body="Automated independent review approved exact head $HEAD_SHA. Context: $CONTEXT_SHA256"
          elif [ "$DISPOSITION" = "approved" ]; then
            body="Exact-head runtime replay did not resolve every original finding; another bounded repair attempt is required. Context: $CONTEXT_SHA256"
          elif \
            [ "$DISPOSITION" != "retry" ] &&
            [ "$DISPOSITION" != "blocked" ] &&
            [ "$RUNTIME_DISPOSITION" != "retry" ] &&
            [ "$RUNTIME_DISPOSITION" != "blocked" ]
          then
            echo "Unexpected review/runtime disposition: $DISPOSITION/$RUNTIME_DISPOSITION" >&2
            exit 1
          fi

          gh api --method POST "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" \
            -f commit_id="$HEAD_SHA" \
            -f event="$event" \
            -f body="$body" > "$RUNNER_TEMP/created-review.json"
          test "$(jq -r .commit_id "$RUNNER_TEMP/created-review.json")" = "$HEAD_SHA"
          echo "$event submitted by $reviewer for $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"

  resolve:
    needs:
      - repair
      - validate
      - publish
      - review
      - runtime
      - submit_review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      disposition: ${{ steps.resolve.outputs.disposition }}
      candidate_artifact: ${{ steps.resolve.outputs.candidate_artifact }}
      feedback_artifact: ${{ steps.resolve.outputs.feedback_artifact }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_url: ${{ steps.resolve.outputs.pr_url }}
    steps:
      - name: Resolve exactly one attempt outcome
        id: resolve
        env:
          REPAIR_RESULT: ${{ needs.repair.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VALIDATE_DISPOSITION: ${{ needs.validate.outputs.disposition }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          REVIEW_DISPOSITION: ${{ needs.review.outputs.disposition }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          RUNTIME_DISPOSITION: ${{ needs.runtime.outputs.disposition }}
          SUBMIT_RESULT: ${{ needs.submit_review.result }}
          PUBLISHED_HEAD_SHA: ${{ needs.publish.outputs.head_sha }}
          PREVIOUS_HEAD_SHA: ${{ inputs.previous_head_sha }}
          PUBLISHED_PR_NUMBER: ${{ needs.publish.outputs.pr_number }}
          PREVIOUS_PR_NUMBER: ${{ inputs.pr_number }}
          PUBLISHED_PR_URL: ${{ needs.publish.outputs.pr_url }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          test "$REPAIR_RESULT" = success
          test "$VALIDATE_RESULT" = success

          disposition="$VALIDATE_DISPOSITION"
          feedback_artifact="upstream-agentic-feedback-$ATTEMPT"
          if [ "$VALIDATE_DISPOSITION" = review ]; then
            test "$PUBLISH_RESULT" = success
            test "$REVIEW_RESULT" = success
            if [ "$REVIEW_DISPOSITION" = approved ]; then
              test "$RUNTIME_RESULT" = success
              disposition="$RUNTIME_DISPOSITION"
            else
              disposition="$REVIEW_DISPOSITION"
            fi
            test "$SUBMIT_RESULT" = success
          elif [ "$VALIDATE_DISPOSITION" != retry ] && [ "$VALIDATE_DISPOSITION" != blocked ]; then
            echo "Validation did not produce an explicit outcome." >&2
            exit 1
          fi

          if [ "$disposition" = approved ]; then
            feedback_artifact=""
          elif [ "$disposition" != retry ] && [ "$disposition" != blocked ]; then
            echo "Attempt did not reach an explicit terminal or retry state." >&2
            exit 1
          fi

          head_sha="${PUBLISHED_HEAD_SHA:-$PREVIOUS_HEAD_SHA}"
          pr_number="${PUBLISHED_PR_NUMBER:-$PREVIOUS_PR_NUMBER}"
          echo "disposition=$disposition" >> "$GITHUB_OUTPUT"
          echo "candidate_artifact=upstream-agentic-candidate-$ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "feedback_artifact=$feedback_artifact" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PUBLISHED_PR_URL" >> "$GITHUB_OUTPUT"

          {
            echo "### Attempt $((ATTEMPT + 1))"
            echo
            echo "- Disposition: \`$disposition\`"
            echo "- Candidate: \`upstream-agentic-candidate-$ATTEMPT\`"
            echo "- Head: \`${head_sha:-not-published}\`"
          } >> "$GITHUB_STEP_SUMMARY"
